# Regtest reference stack: bitcoind + CLN + coordinator API + payout worker.
# NO REAL FUNDS. For mainnet you would swap the network flags and lock down
# the RPC paths — see README "Going to production" (not ready yet).
services:
  bitcoind:
    image: bitcoin/bitcoin:28.0
    command: >
      -regtest -server -txindex
      -rpcuser=swirl -rpcpassword=swirl
      -rpcallowip=0.0.0.0/0 -rpcbind=0.0.0.0
      -fallbackfee=0.00001
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin

  lightningd:
    build:
      context: .
      dockerfile: Dockerfile.cln-hold
    command: >
      --network=regtest
      --bitcoin-rpcconnect=bitcoind --bitcoin-rpcport=18443
      --bitcoin-rpcuser=swirl --bitcoin-rpcpassword=swirl
      --log-level=info
      --important-plugin=/usr/local/bin/hold
      --hold-expiry-deadline=1 --hold-grpc-port=-1
    volumes:
      - lightning-data:/root/.lightning
      - cln-rpc:/root/.lightning/regtest
    depends_on:
      - bitcoind

  payer:
    build:
      context: .
      dockerfile: Dockerfile.cln-hold
    command: >
      --network=regtest
      --bitcoin-rpcconnect=bitcoind --bitcoin-rpcport=18443
      --bitcoin-rpcuser=swirl --bitcoin-rpcpassword=swirl
      --log-level=info
    volumes:
      - payer-data:/root/.lightning
    depends_on:
      - bitcoind

  coordinator-api:
    build: .
    environment:
      SWIRL_CLN_RPC: /cln/lightning-rpc
      SWIRL_DB: /data/swirl.db
      SWIRL_MIN_HOLD: "60"        # regtest only — production default is 3600
      SWIRL_JITTER_MAX: "15"
      SWIRL_HELD_HTLC: "true"
      SWIRL_INVOICE_EXPIRY: "1800"
      SWIRL_SETTLEMENT_SAFETY_SECONDS: "120"
      SWIRL_SETTLEMENT_SAFETY_BLOCKS: "2"
    volumes:
      - coordinator-data:/data
      - cln-rpc:/cln
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - lightningd

  coordinator-worker:
    build: .
    command: python -m app.worker
    environment:
      SWIRL_CLN_RPC: /cln/lightning-rpc
      SWIRL_DB: /data/swirl.db
      SWIRL_MIN_HOLD: "60"
      SWIRL_JITTER_MAX: "15"
      SWIRL_HELD_HTLC: "true"
      SWIRL_INVOICE_EXPIRY: "1800"
      SWIRL_SETTLEMENT_SAFETY_SECONDS: "120"
      SWIRL_SETTLEMENT_SAFETY_BLOCKS: "2"
    volumes:
      - coordinator-data:/data
      - cln-rpc:/cln
    depends_on:
      - lightningd

volumes:
  bitcoin-data:
  lightning-data:
  payer-data:
  cln-rpc:
  coordinator-data:
